name: erc-8232

plugins:
  - name: vyper
  - name: avalanche
  - name: ethereum

default_ecosystem: avalanche

vyper:
  version: "0.4.3"
  enable_decimals: true
  evm_version: "shanghai"

networks:
  avalanche:
    fuji:
      default_provider: node
  ethereum:
    sepolia:
      default_provider: node
    goerli:
      default_provider: alchemy

node:
  avalanche:
    fuji:
      url: "https://api.avax-test.network/ext/bc/C/rpc"
      chain_id: 43113
      explorer: "https://testnet.snowtrace.io"
  ethereum:
    sepolia:
      url: "https://ethereum-sepolia-rpc.publicnode.com"
      chain_id: 11155111
      explorer: "https://sepolia.etherscan.io"
    goerli:
      url: "https://goerli.infura.io/v3/${WEB3_INFURA_PROJECT_ID}"
      chain_id: 5
      explorer: "https://goerli.etherscan.io"

alchemy:
  avalanche:
    fuji:
      uri: https://avax-fuji.g.alchemy.com/v2/${WEB3_ALCHEMY_API_KEY}
  ethereum:
    sepolia:
      uri: https://eth-sepolia.g.alchemy.com/v2/${WEB3_ALCHEMY_API_KEY}
    goerli:
      uri: https://eth-goerli.g.alchemy.com/v2/${WEB3_ALCHEMY_API_KEY}